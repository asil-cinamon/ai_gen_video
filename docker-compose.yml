version: '3.8'
services:
  api:
    build: .
    ports:
      - "3000:3000"
    environment:
      - APP_PORT=3000
      - NODE_ENV=development
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis
      - postgres

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_gen
    ports:
      - "5432:5432"

  worker-python:
    build:
      context: ./worker
    environment:
      - REDIS_URL=redis://redis:6379
      - S3_BUCKET=${S3_BUCKET}
      - API_URL=http://api:3000
    depends_on:
      - redis
      - api
